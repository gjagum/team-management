services:
  postgres:
    image: postgres:16-alpine
    container_name: team-db
    environment:
      POSTGRES_USER: teamuser
      POSTGRES_PASSWORD: teampass
      POSTGRES_DB: teammanagement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-app
    environment:
      DATABASE_URL: postgres://teamuser:teampass@postgres:5432/teammanagement
      JWT_SECRET: your-secret-key-change-in-production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
